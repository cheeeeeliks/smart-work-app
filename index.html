<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart WorkSession</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: var(--tg-theme-bg-color, #f4f4f4); color: var(--tg-theme-text-color, #000); padding: 15px; text-align: center; }
        .card { background-color: var(--tg-theme-secondary-bg-color, #fff); border-radius: 12px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h3 { margin-top: 0; margin-bottom: 10px;}
        input[type="text"], input[type="number"] { width: 90%; padding: 10px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; text-align: center; font-size: 16px; box-sizing: border-box; }
        .checkbox-container { margin: 10px 0 15px 0; font-size: 14px; color: var(--tg-theme-hint-color, #888); }
        .btn-group { display: flex; justify-content: space-between; gap: 10px; }
        button { border: none; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: bold; width: 100%; cursor: pointer; color: white; }
    </style>
</head>
<body>
    <h2>Управление ПК 💻</h2>

    <div class="card">
        <h3>🍅 Фокус-режим</h3>
        <input type="number" id="focusTime" value="25" placeholder="Минуты">
        <div class="btn-group">
            <button style="background-color: #ff4757;" onclick="sendCmd('/focus ' + document.getElementById('focusTime').value)">СТАРТ</button>
            <button style="background-color: #2f3542;" onclick="sendCmd('/stopfocus')">СТОП</button>
        </div>
    </div>

    <div class="card">
        <h3>🔍 Монитор задач</h3>
        <input type="text" id="processName" value="notepad.exe" placeholder="Имя процесса">
        <div class="checkbox-container"><input type="checkbox" id="shutdownCheck"> Выключить ПК по завершении</div>
        <div class="btn-group">
            <button style="background-color: #2ed573;" onclick="sendCmd('/monitor ' + document.getElementById('processName').value + ' ' + document.getElementById('shutdownCheck').checked)">СЛЕДИТЬ</button>
            <button style="background-color: #2f3542;" onclick="sendCmd('/stopmonitor')">СТОП</button>
        </div>
    </div>

    <div class="card">
        <h3>🚀 Доп. Функции</h3>
        <div class="btn-group">
            <button style="background-color: #3742fa;" onclick="sendCmd('/screenshot')">📸 Скриншот</button>
            <button style="background-color: #ffa502;" onclick="sendCmd('/stats')">📊 Статистика</button>
        </div>
    </div>

    <div class="card">
        <h3>⚙️ Настройки</h3>
        <input type="text" id="newSite" placeholder="Например: instagram.com">
        <button style="background-color: #1e90ff;" onclick="if(document.getElementById('newSite').value) sendCmd('/addsite ' + document.getElementById('newSite').value)">+ Блок сайта</button>
        <input type="text" id="newApp" placeholder="Например: dota2.exe" style="margin-top: 15px;">
        <button style="background-color: #1e90ff;" onclick="if(document.getElementById('newApp').value) sendCmd('/addapp ' + document.getElementById('newApp').value)">+ Блок программы</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp; tg.expand(); 
        function sendCmd(cmd) { tg.sendData(cmd); tg.close(); }
    </script>
</body>
</html>
