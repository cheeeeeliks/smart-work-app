<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart WorkSession</title>
    <!-- Подключаем библиотеку Телеграма -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f4);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            text-align: center;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #ffffff);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        input {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            text-align: center;
            font-size: 16px;
        }
        button {
            background-color: var(--tg-theme-button-color, #ff4757);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            transition: 0.3s; /* Плавная анимация изменения цвета */
        }
        .btn-green {
            background-color: #2ed573;
        }
    </style>
</head>
<body>

    <h2>Управление ПК 💻</h2>

    <div class="card">
        <h3>🍅 Фокус-режим</h3>
        <p>Время (в минутах):</p>
        <input type="number" id="focusTime" value="25">
        <!-- Добавили id="btnFocus" для изменения кнопки -->
        <button id="btnFocus" onclick="sendFocusCommand()">СТАРТ ФОКУС</button>
    </div>

    <div class="card">
        <h3>🔍 Монитор задач</h3>
        <p>Имя процесса:</p>
        <input type="text" id="processName" value="notepad.exe">
        <!-- Добавили id="btnMonitor" для изменения кнопки -->
        <button id="btnMonitor" class="btn-green" onclick="sendMonitorCommand()">НАЧАТЬ СЛЕЖКУ</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 

        function sendFocusCommand() {
            let minutes = document.getElementById("focusTime").value;
            // Отправляем команду
            tg.sendData("/focus " + minutes);
            // Принудительно закрываем интерфейс
            tg.close();
        }

        function sendMonitorCommand() {
            let process = document.getElementById("processName").value;
            tg.sendData("/monitor " + process);
            tg.close();
        }
    </script>

</body>
</html>
